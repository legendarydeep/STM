{% extends 'base.html' %}

{% block title %}Add New Task{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
  <div class="content-card">
    <div class="card-title-bar" style="border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; margin-bottom: 1.5rem;">
      <h2>Add New Task</h2>
      <a href="{{ url_for('tasks_view') }}" class="btn btn-secondary btn-sm">Cancel</a>
    </div>

    <form action="{{ url_for('add_task') }}" method="POST">
      <div class="form-group" style="margin-bottom: 1.15rem;">
        <label for="title">Task Title <span class="required">*</span></label>
        <input type="text" id="title" name="title" class="input-field" placeholder="Enter task name" value="{{ title|default('') }}" required maxlength="150" autofocus>
      </div>

      <div class="form-group" style="margin-bottom: 1.15rem;">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" class="input-field" placeholder="e.g. Mathematics, Web Development" value="{{ subject|default('') }}" list="subject-suggestions">
        <datalist id="subject-suggestions">
          {% for sub in default_subjects %}
            <option value="{{ sub }}">
          {% endfor %}
        </datalist>
      </div>

      <div class="form-grid-2" style="margin-bottom: 1.15rem;">
        <div class="form-group">
          <label for="priority">Priority</label>
          <select id="priority" name="priority" class="select-field">
            {% for pr in valid_priorities %}
              <option value="{{ pr }}" {% if priority|default('Medium') == pr %}selected{% endif %}>{{ pr }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="due_date">Due Date</label>
          <input type="date" id="due_date" name="due_date" class="input-field" value="{{ due_date|default('') }}">
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="description">Description (Optional)</label>
        <textarea id="description" name="description" class="textarea-field" rows="3" placeholder="Add task description or requirements...">{{ description|default('') }}</textarea>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 0.75rem;">
        <a href="{{ url_for('tasks_view') }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Add Task</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
