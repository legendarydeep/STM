{% extends 'base.html' %}

{% block title %}Create Task{% endblock %}

{% block content %}
<div class="form-card">
  <div class="form-header">
    <h2>Add New Task</h2>
    <p>Define a new coursework, assignment, or project task.</p>
  </div>

  <form method="POST" action="{{ url_for('add_task') }}" novalidate>
    <!-- Task Title -->
    <div class="form-row">
      <label for="title" class="form-label">Task Title <span class="required">*</span></label>
      <input 
        type="text" 
        id="title" 
        name="title" 
        class="form-control" 
        placeholder="e.g., Complete Compiler Design Lab Sheet 4"
        value="{{ title|default('') }}"
        required
        maxlength="150"
        autofocus
      >
    </div>

    <!-- Description -->
    <div class="form-row">
      <label for="description" class="form-label">Description</label>
      <textarea 
        id="description" 
        name="description" 
        class="form-control" 
        placeholder="Optional details, notes, reference links, or steps..."
      >{{ description|default('') }}</textarea>
    </div>

    <!-- Priority and Due Date Grid -->
    <div class="form-grid-2 form-row">
      <div>
        <label for="priority" class="form-label">Priority</label>
        <select id="priority" name="priority" class="form-control">
          {% for pr in valid_priorities %}
            <option value="{{ pr }}" {% if priority|default('Medium') == pr %}selected{% endif %}>{{ pr }}</option>
          {% endfor %}
        </select>
      </div>

      <div>
        <label for="due_date" class="form-label">Due Date</label>
        <input 
          type="date" 
          id="due_date" 
          name="due_date" 
          class="form-control"
          value="{{ due_date|default('') }}"
        >
      </div>
    </div>

    <!-- Status -->
    <div class="form-row">
      <label for="status" class="form-label">Initial Status</label>
      <select id="status" name="status" class="form-control">
        {% for st in valid_statuses %}
          <option value="{{ st }}" {% if status|default('Pending') == st %}selected{% endif %}>{{ st }}</option>
        {% endfor %}
      </select>
    </div>

    <!-- Actions -->
    <div class="form-actions">
      <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
      <button type="submit" class="btn btn-primary">Save Task</button>
    </div>
  </form>
</div>
{% endblock %}
