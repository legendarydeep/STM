{% extends 'base.html' %}

{% block title %}Edit Task #{{ task['id'] }}{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto;">
  <div class="content-card">
    <div class="card-title-bar" style="border-bottom: 1px solid var(--border-color); padding-bottom: 1rem; margin-bottom: 1.5rem;">
      <h2>Edit Task #{{ task['id'] }}</h2>
      <a href="{{ url_for('tasks_view') }}" class="btn btn-secondary btn-sm">Cancel</a>
    </div>

    <form action="{{ url_for('edit_task', task_id=task['id']) }}" method="POST">
      <div class="form-group" style="margin-bottom: 1.15rem;">
        <label for="title">Task Title <span class="required">*</span></label>
        <input type="text" id="title" name="title" class="input-field" value="{{ task['title'] }}" required maxlength="150" autofocus>
      </div>

      <div class="form-group" style="margin-bottom: 1.15rem;">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" class="input-field" value="{{ task['subject'] or '' }}" placeholder="e.g. Mathematics, Web Development" list="subject-suggestions">
        <datalist id="subject-suggestions">
          {% for sub in default_subjects %}
            <option value="{{ sub }}">
          {% endfor %}
        </datalist>
      </div>

      <div class="form-grid-2" style="margin-bottom: 1.15rem;">
        <div class="form-group">
          <label for="priority">Priority</label>
          <select id="priority" name="priority" class="select-field">
            {% for pr in valid_priorities %}
              <option value="{{ pr }}" {% if task['priority'] == pr %}selected{% endif %}>{{ pr }}</option>
            {% endfor %}
          </select>
        </div>

        <div class="form-group">
          <label for="due_date">Due Date</label>
          <input type="date" id="due_date" name="due_date" class="input-field" value="{{ task['due_date'] or '' }}">
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 1.15rem;">
        <label for="status">Status</label>
        <select id="status" name="status" class="select-field">
          {% for st in valid_statuses %}
            <option value="{{ st }}" {% if task['status'] == st %}selected{% endif %}>{{ st }}</option>
          {% endfor %}
        </select>
      </div>

      <div class="form-group" style="margin-bottom: 1.5rem;">
        <label for="description">Description (Optional)</label>
        <textarea id="description" name="description" class="textarea-field" rows="3">{{ task['description'] or '' }}</textarea>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 0.75rem;">
        <a href="{{ url_for('tasks_view') }}" class="btn btn-secondary">Cancel</a>
        <button type="submit" class="btn btn-primary">Update Task</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
